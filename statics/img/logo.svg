<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 深绿渐变背景 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F281E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="32" fill="url(#bgGradient)"/>

  <!-- 节点布局 - 基于球体分布 -->
  <circle cx="60" cy="55" r="4" fill="#10B981"/>
  <circle cx="30" cy="35" r="3.5" fill="#34D399"/>
  <circle cx="100" cy="20" r="3.3" fill="#34D399"/>
  <circle cx="15" cy="65" r="2.8" fill="#34D399"/>
  <circle cx="95" cy="70" r="3" fill="#34D399"/>
  <circle cx="35" cy="95" r="2.6" fill="#34D399"/>
  
  <!-- 节点间连接 -->
  <line x1="60" y1="55" x2="30" y2="35" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="60" y1="55" x2="15" y2="65" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="60" y1="55" x2="95" y2="70" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</svg>
